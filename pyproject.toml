[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The INSTALL name. The import package and the command stay `dqengine`
# (`pip install scikit-learn` / `import sklearn`): PyPI refuses `dqengine` as
# too similar to the existing, unrelated `dq-engine`.
name = "deployquant"
version = "0.1.0"
description = "The fastest event-driven backtester we know of for US stocks on bars. Python, LEAN-compatible. The engine behind DeployQuant."
keywords = ["backtesting", "backtest", "algorithmic trading", "algo trading", "trading engine",
            "quant", "quantitative finance", "trading strategies", "stocks", "ETF", "fast",
            "high performance", "live trading", "Alpaca", "LEAN"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
readme = "README.md"
# 3.11: the sandbox image runs the engine on the LEAN foundation base (py3.11) — where the parity numbers were measured; the api/venv are 3.12
requires-python = ">=3.11"
license = { text = "PolyForm-Shield-1.0.0" }
# <3: the parity numbers were measured on pandas 2.x (the LEAN sandbox base ships 2.1.4); keep fresh installs on the same major
dependencies = ["numpy>=1.26", "pandas>=2.1,<3"]

[project.optional-dependencies]
# the sandbox HTTP service (dqengine.sandbox.service) is the only part that
# needs a web framework; `pip install deployquant` stays numpy+pandas
sandbox = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.urls]
Homepage = "https://deployquant.com"
Source = "https://github.com/praneetsah/deployquant"
Issues = "https://github.com/praneetsah/deployquant/issues"

[project.scripts]
dqengine = "dqengine.cli:main"

# Broker adapters are discovered by `pip install`: a plugin distribution
# (dqengine-webull, dqengine-schwab, ...) declares one entry point in this
# group per adapter class. The engine's own bundled adapters are registered
# the same way so the engine's own broker goes through the same door.
[project.entry-points."dqengine.brokers"]
alpaca = "dqengine.adapters.alpaca:AlpacaAdapter"
alpaca-paper = "dqengine.adapters.alpaca_paper:AlpacaPaperAdapter"

# the Apache text travels with the LEAN-derived portions (Apache-2.0 s4(a))
[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dqengine*"]
exclude = ["tests*", "strategies*", "tools*"]

# the sandbox image definition ships with the runner that launches it, so
# dqengine.sandbox.pyrunner.SANDBOX_DOCKERFILE exists in an installed copy too
[tool.setuptools.package-data]
"dqengine.sandbox" = ["Dockerfile.pyrunner"]
